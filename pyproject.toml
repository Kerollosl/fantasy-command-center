[project]
name = "fantasy-command-center"
version = "0.1.0"
description = "Live fantasy football draft assistant: projections, VONA recommendations, and real-time draft grades for every team."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
ffcc = "ffcc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffcc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
